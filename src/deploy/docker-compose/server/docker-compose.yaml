name: moj-server

services:
  proxy:
    # Build the released Caddy source with patched Go/HTTP2 dependencies.
    image: moj-caddy:2.11.7-security1
    build:
      context: ./proxy
    pull_policy: never
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${PROXY_HTTP_BIND:-0.0.0.0:80}:80"
      - "${PROXY_HTTPS_BIND:-0.0.0.0:443}:443"
      # Restrict 8443 to administrator IPs in the provider/network firewall.
      - "${AUTH_ADMIN_BIND:-0.0.0.0:8443}:8443"
    environment:
      MOJ_BASE_URL: "${MOJ_BASE_URL:?Run prepare-urls.py and load generated/urls.env after .env}"
      AUTH_BASE_URL: "${AUTH_BASE_URL:?Run prepare-urls.py and load generated/urls.env after .env}"
      AUTH_ADMIN_PROXY_URL: "${AUTH_ADMIN_PROXY_URL:?Run prepare-urls.py}"
      MOJ_PROXY_PORT: "${MOJ_PROXY_PORT:?Run prepare-urls.py}"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - "caddy_data:/data"
      - "caddy_config:/config"
    networks:
      moj:
        aliases:
          - "${MOJ_PROXY_HOST:?Run prepare-urls.py}"
          - "${AUTH_PROXY_HOST:?Run prepare-urls.py}"
    # Start independently: controller startup fetches discovery through this proxy.

  postgresql:
    image: postgres:15
    cpus: 1
    mem_reservation: 128m
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      # TCP avoids the temporary Unix-socket server used during initialization.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      IAM_DB_PASSWORD: "${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in .env}"
      MOJ_DB_PASSWORD: "${MOJ_DB_PASSWORD:?Set MOJ_DB_PASSWORD in .env}"
    volumes:
      - "postgresql_data:/var/lib/postgresql/data"
      - "./scripts:/docker-entrypoint-initdb.d"
    networks:
      - moj

  auth:
    image: quay.io/keycloak/keycloak:26.8.0
    cpus: 1
    mem_reservation: 512m
    mem_limit: 1g
    restart: unless-stopped
    command:
      # Production mode; Caddy terminates public TLS on the private Compose network.
      - "start"
      - "--import-realm"
      - "--http-enabled=true"
    environment:
      # Keep deployment .env names compatible; map to Keycloak's bootstrap options.
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}"
      KC_DB: postgres
      KC_DB_USERNAME: iam
      KC_DB_PASSWORD: "${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in .env}"
      KC_DB_URL: "jdbc:postgresql://postgresql:5432/iam"
      KC_HEALTH_ENABLED: "true"
      # Caddy terminates TLS and overwrites X-Forwarded-* headers.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_MANAGEMENT_SCHEME: http
      # Hostname v2: both browser and backchannel use the same external origin.
      KC_HOSTNAME: "${KC_HOSTNAME:?Run prepare-urls.py and load generated/urls.env after .env}"
      KC_HOSTNAME_ADMIN: "${AUTH_ADMIN_PROXY_URL:?Run prepare-urls.py}"
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    volumes:
      - type: bind
        source: ./generated/realms
        target: /opt/keycloak/data/import
        read_only: true
        bind:
          create_host_path: false
      - "./healthchecks:/opt/moj-healthchecks:ro"
    healthcheck:
      # Readiness on private management port 9000; realm discovery on 8080.
      test: ["CMD", "/bin/bash", "/opt/moj-healthchecks/keycloak-ready.sh"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 12
    networks:
      - moj
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true

  controller:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/moj-controller:${MOJ_IMAGE_TAG:?Set MOJ_IMAGE_TAG to a published SHA tag in .env}
    cpus: 2
    mem_reservation: 1g
    mem_limit: 2g
    restart: unless-stopped
    environment:
      OIDC_ISSUER_URI: "${OIDC_ISSUER_URI:?Run prepare-urls.py and load generated/urls.env after .env}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/moj"
      SPRING_DATASOURCE_USERNAME: "moj"
      SPRING_DATASOURCE_PASSWORD: "${MOJ_DB_PASSWORD:?Set MOJ_DB_PASSWORD in .env}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_ARTEMIS_USER: "${ARTEMIS_USER:?Set ARTEMIS_USER in .env}"
      SPRING_ARTEMIS_PASSWORD: "${ARTEMIS_PASSWORD:?Set ARTEMIS_PASSWORD in .env}"
      SPRING_H2_CONSOLE_ENABLED: "false"
      MOJ_BROKER_AUTHENTICATION_ENABLED: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_PORT_HEADER: X-Forwarded-Port
    volumes:
      - "controller_data:/data"
      - "./healthchecks:/opt/moj-healthchecks:ro"
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/moj-healthchecks/http-ready.sh", "/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    networks:
      - moj
    depends_on:
      proxy:
        condition: service_started
        restart: true
      postgresql:
        condition: service_healthy
        restart: true
      auth:
        condition: service_healthy
        restart: true

  worker:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/moj-worker:${MOJ_IMAGE_TAG:?Set MOJ_IMAGE_TAG to a published SHA tag in .env}
    cpus: 3
    mem_reservation: 1g
    mem_limit: 2g
    restart: unless-stopped
    environment:
      CONTROLLER_URI: "http://controller:8080"
      CONTROLLER_BROKER_URI: "tcp://controller:61616"
      SPRING_ARTEMIS_USER: "${ARTEMIS_USER:?Set ARTEMIS_USER in .env}"
      SPRING_ARTEMIS_PASSWORD: "${ARTEMIS_PASSWORD:?Set ARTEMIS_PASSWORD in .env}"
      SPRING_H2_CONSOLE_ENABLED: "false"
      SPRING_JMS_LISTENER_CONCURRENCY: 3
      SPRING_JMS_LISTENER_MAX_CONCURRENCY: 3
    networks:
      - moj
    depends_on:
      controller:
        condition: service_healthy
        restart: true

networks:
  moj: {}

volumes:
  postgresql_data: {}
  controller_data: {}
  caddy_data: {}
  caddy_config: {}
