services:
  postgresql:
    image: postgres:15
    cpus: 1
    mem_reservation: 128m
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_MULTIPLE_DATABASES: "iam:iam:${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in .env},moj:moj:${MOJ_DB_PASSWORD:?Set MOJ_DB_PASSWORD in .env}"
    volumes:
      - "./scripts:/docker-entrypoint-initdb.d"
    networks:
      - moj

  auth:
    image: quay.io/keycloak/keycloak:21.1
    cpus: 1
    mem_reservation: 512m
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    command:
      - "start-dev"
      - "--import-realm"
      - "--hostname=host.docker.internal"
      - "--hostname-strict-https=false"
      - "--http-enabled=true"
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}"
      KC_DB: postgres
      KC_DB_USERNAME: iam
      KC_DB_PASSWORD: "${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in .env}"
      KC_DB_URL: "jdbc:postgresql://postgresql:5432/iam"
    volumes:
      - "./realms:/opt/keycloak/data/import"
    networks:
      - moj
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_started

  controller:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/moj-controller:${MOJ_IMAGE_TAG:?Set MOJ_IMAGE_TAG to a published SHA tag in .env}
    cpus: 2
    mem_reservation: 1g
    mem_limit: 2g
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OIDC_ISSUER_URI: "http://host.docker.internal:8888/realms/moj"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/moj"
      SPRING_DATASOURCE_USERNAME: "moj"
      SPRING_DATASOURCE_PASSWORD: "${MOJ_DB_PASSWORD:?Set MOJ_DB_PASSWORD in .env}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
    networks:
      - moj
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_started
      auth:
        condition: service_started

  worker:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/moj-worker:${MOJ_IMAGE_TAG:?Set MOJ_IMAGE_TAG to a published SHA tag in .env}
    cpus: 3
    mem_reservation: 1g
    mem_limit: 2g
    restart: unless-stopped
    environment:
      CONTROLLER_URI: "http://controller:8080"
      CONTROLLER_BROKER_URI: "tcp://controller:61616"
      SPRING_JMS_LISTENER_CONCURRENCY: 3
      SPRING_JMS_LISTENER_MAX_CONCURRENCY: 3
    networks:
      - moj
    depends_on:
      controller:
        condition: service_started

networks:
  moj: {}
