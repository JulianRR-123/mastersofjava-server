name: moj-server

services:
  postgresql:
    image: postgres:15
    cpus: 1
    mem_reservation: 128m
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      # TCP avoids the temporary Unix-socket server used during initialization.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      IAM_DB_PASSWORD: "${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in .env}"
      MOJ_DB_PASSWORD: "${MOJ_DB_PASSWORD:?Set MOJ_DB_PASSWORD in .env}"
    volumes:
      - "postgresql_data:/var/lib/postgresql/data"
      - "./scripts:/docker-entrypoint-initdb.d"
    networks:
      - moj

  auth:
    image: quay.io/keycloak/keycloak:21.1
    cpus: 1
    mem_reservation: 512m
    mem_limit: 1g
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    command:
      - "start-dev"
      - "--import-realm"
      - "--hostname=host.docker.internal"
      - "--hostname-strict-https=false"
      - "--http-enabled=true"
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}"
      KC_DB: postgres
      KC_DB_USERNAME: iam
      KC_DB_PASSWORD: "${IAM_DB_PASSWORD:?Set IAM_DB_PASSWORD in .env}"
      KC_DB_URL: "jdbc:postgresql://postgresql:5432/iam"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - "./realms:/opt/keycloak/data/import"
      - "./healthchecks:/opt/moj-healthchecks:ro"
    healthcheck:
      # Keycloak 21.1 serves health on 8080; it has Bash but no curl/wget.
      test: ["CMD", "/bin/bash", "/opt/moj-healthchecks/http-ready.sh", "/health/ready", "/realms/moj/.well-known/openid-configuration"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 12
    networks:
      - moj
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true

  controller:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/moj-controller:${MOJ_IMAGE_TAG:?Set MOJ_IMAGE_TAG to a published SHA tag in .env}
    cpus: 2
    mem_reservation: 1g
    mem_limit: 2g
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OIDC_ISSUER_URI: "http://host.docker.internal:8888/realms/moj"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/moj"
      SPRING_DATASOURCE_USERNAME: "moj"
      SPRING_DATASOURCE_PASSWORD: "${MOJ_DB_PASSWORD:?Set MOJ_DB_PASSWORD in .env}"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
      SPRING_ARTEMIS_USER: "${ARTEMIS_USER:?Set ARTEMIS_USER in .env}"
      SPRING_ARTEMIS_PASSWORD: "${ARTEMIS_PASSWORD:?Set ARTEMIS_PASSWORD in .env}"
      SPRING_H2_CONSOLE_ENABLED: "false"
      MOJ_BROKER_AUTHENTICATION_ENABLED: "true"
    volumes:
      - "controller_data:/data"
      - "./healthchecks:/opt/moj-healthchecks:ro"
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/moj-healthchecks/http-ready.sh", "/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    networks:
      - moj
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgresql:
        condition: service_healthy
        restart: true
      auth:
        condition: service_healthy
        restart: true

  worker:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/moj-worker:${MOJ_IMAGE_TAG:?Set MOJ_IMAGE_TAG to a published SHA tag in .env}
    cpus: 3
    mem_reservation: 1g
    mem_limit: 2g
    restart: unless-stopped
    environment:
      CONTROLLER_URI: "http://controller:8080"
      CONTROLLER_BROKER_URI: "tcp://controller:61616"
      SPRING_ARTEMIS_USER: "${ARTEMIS_USER:?Set ARTEMIS_USER in .env}"
      SPRING_ARTEMIS_PASSWORD: "${ARTEMIS_PASSWORD:?Set ARTEMIS_PASSWORD in .env}"
      SPRING_H2_CONSOLE_ENABLED: "false"
      SPRING_JMS_LISTENER_CONCURRENCY: 3
      SPRING_JMS_LISTENER_MAX_CONCURRENCY: 3
    networks:
      - moj
    depends_on:
      controller:
        condition: service_healthy
        restart: true

networks:
  moj: {}

volumes:
  postgresql_data: {}
  controller_data: {}
